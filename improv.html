<!DOCTYPE html>
<html>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;touch-action:none}
  html,body{height:100dvh;width:100vw;overflow:hidden;background:#121212;display:flex;justify-content:center;align-items:center;padding:8px}
  #pianos{display:flex;flex-direction:column;gap:6px;height:100%;width:100%;max-width:600px}
  .piano{flex:1;min-height:0;display:flex;background:#000;padding:4px;gap:2px;border-radius:6px;position:relative}
  .key{flex:1;min-height:0;background:white;color:black;display:flex;align-items:flex-end;justify-content:center;border-radius:0 0 3px 3px;cursor:pointer;transition:background 0.2s}
  .key.black{background:#222;color:white;height:60%;margin:0 -12px;z-index:2;flex:0.7}
  .key.active-preset{background:#cfd8ff;border-bottom:4px solid blue}
</style>
<div id="pianos"></div>
<script>
let A=new AudioContext(),P,activeTrack=0;
let C3=123;
let notes=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B","C"];
let pianosDiv=document.getElementById("pianos");
const Battito=window.opener?.Battito;
let SONG={tracks:window.opener?.SONG?.tracks||[]};
new BroadcastChannel("synth_presets").onmessage=e=>{
  let data=e.data?.tracks||e.data;
  if(Array.isArray(data))SONG.tracks=data;
};
let naturalKeys=Array.from({length:8},()=>[]);
for(let oct=3;oct>=0;oct--){
  let pianoDiv=document.createElement("div");
  pianoDiv.className="piano";
  let naturalCount=0;
  notes.forEach((note,col)=>{
    let key=document.createElement("div");
    let isBlack=note.includes("#");
    key.className="key"+(isBlack?" black":"");
    let naturalIdx=-1;
    if(!isBlack){
      naturalIdx=naturalCount++;
      naturalKeys[naturalIdx].push(key);
    }
    let timer;
    let noteNum=col+C3+(oct*12);
    key.onpointerdown=()=>{
      clearTimeout(timer);
      if(!isBlack){
        timer=setTimeout(()=>{
          activeTrack=naturalIdx;
          updatePresetVisuals();
          play(noteNum);
        },500);
      }
      play(noteNum);
      key.style.opacity="0.7";
    };
    key.onpointerup=key.onpointerleave=()=>{
      clearTimeout(timer);
      key.style.opacity="1";
    };
    pianoDiv.appendChild(key);
  });
  pianosDiv.appendChild(pianoDiv);
}
function updatePresetVisuals(){
  naturalKeys.forEach((keys,idx)=>{
    keys.forEach(k=>k.classList.toggle("active-preset",idx===activeTrack));
  });
}
updatePresetVisuals();
function play(n){
  try{
    if(A.state==="suspended")A.resume();
    P?.stop();
    let track=SONG.tracks[activeTrack];
    if(!track||!Battito)return;
    P=source({bpm:100,tracks:[{...track,s:[1],p:[{length:32,0:n}]}]});
    P.start();
  }catch(e){}
}
function source(s){let n;return s&&(n=Object.assign(A.createBufferSource(),{buffer:Battito(A).createbuffer(s)}),n.connect(A.destination),n)}
</script>
